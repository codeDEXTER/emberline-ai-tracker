name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# This repo had 128 tests and no CI. main was red from 8 to 10 August 2026 --
# four merges landed on top of a failing suite and nobody knew, because the
# only thing that ran the tests was a human or `bin/land`, and land tests the
# BRANCH before merging, never the merged result (issue #99).
#
# The command below is deliberately byte-identical to what `bin/land`'s
# test_cmd() emits for a Python project. tests/test_ci_matches_land.py fails
# if the two ever drift, so a session cannot change one and forget the other.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not tidiness. The rules version IS
      # `git rev-list --count HEAD` (see bin/rulecheck's current_version), and
      # actions/checkout defaults to a depth-1 shallow clone -- so on a runner
      # HEAD counts as commit 1, and anything comparing a stamped version
      # against it reads "stamp claims 163, but HEAD is only at 1".
      #
      # This was masked until 2026-08-20: `rulecheck --version` used to exit 2
      # on a runner (its rules-repo path was hardcoded to a developer's home
      # directory), so the version was never successfully computed here at all.
      # Fixing that exposed the shallow clone underneath it. rulecheck's
      # changelog diffing (`git diff <old_sha>..HEAD -- CHANGELOG.md`) needs
      # the history for the same reason.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependency install step: the suite is stdlib-only by design, so
      # anything that needs a package is a test that would not run on a fresh
      # machine either. Keep it that way -- a rules repo that cannot be checked
      # out and tested in one step is a rules repo nobody checks.
      - name: Run test suite
        run: python3 -m unittest discover -s tests -q
